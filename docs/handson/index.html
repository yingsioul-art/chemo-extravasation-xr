<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>外滲當下怎麼做</title>
<meta name="description" content="化療藥品外滲初步處理動手互動：拔不拔針、穿什麼、抽多少、用哪支筆，做錯會看到後果。">
<style>
/* ===== 色票：沿用首頁；動手區主色＝橘 t2 ===== */
:root{--bg:#f4f7fb;--card:#fff;--ink:#1c2430;--mut:#5b6675;--line:#e3e8ef;--navy:#123a6b;--acc:#e8792b;--ok:#2e8b57;--ng:#c81e3a;--warn:#d98a00;--cold:#1f6fd0;--dmso:#7a3fb5;--sh:0 2px 10px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.55;font-size:16px}
body{padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto}
header h1{margin:0;font-size:1.05rem;font-weight:700}
header a{color:#fff;text-decoration:none;font-size:.85rem;opacity:.9;white-space:nowrap}
.prog{max-width:640px;margin:8px auto 0;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.sub{max-width:640px;margin:6px auto 0;font-size:.8rem;opacity:.85;display:flex;justify-content:space-between}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border-radius:16px;padding:18px 16px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.15rem;color:var(--navy)}
.card h3{margin:14px 0 6px;font-size:1rem}
.stem{font-size:1.08rem;font-weight:700;margin:6px 0 12px}
.lead{color:var(--mut);font-size:.92rem;margin:0 0 10px}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:6px;background:#eef2f7;color:var(--mut);margin-right:6px}
.badge.acc{background:#fdebdd;color:#a2501a}
.badge.ok{background:#e3f3ea;color:#1e6b42}.badge.ng{background:#fbe3e8;color:#8e1530}
/* ===== 圖卡佔位：先顯示文字卡，若 ../assets/img/h_<id>.png 存在則自動換圖 ===== */
.ph{position:relative;border:2px dashed #b8c2d0;border-radius:12px;background:#f8fafc;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--mut);font-size:.9rem;overflow:hidden}
.ph .id{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:#8a95a5;margin-bottom:4px}
.ph .cap{font-weight:700;color:var(--ink)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.ph.has img{display:block}.ph.has .id,.ph.has .cap,.ph.has .desc{display:none}
.ph.scene{min-height:180px;aspect-ratio:16/9}
.ph.small{min-height:70px;padding:8px;font-size:.82rem}
.ph.nocap .cap{display:none}
/* ===== 按鈕 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;background:var(--acc);color:#fff;min-height:48px;text-decoration:none}
.btn.sec{background:#eef2f7;color:var(--navy)}
.btn.ok{background:var(--ok)}.btn.ng{background:var(--ng)}.btn.navy{background:var(--navy)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 140px}
/* ===== 選項 ===== */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:.98rem;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.45;min-height:52px}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:#eef2f7;color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.opt:active{background:#fff7f0;border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:#effaf3}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:#fdf1f3}.opt.ng .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}
/* 選物格（空針／筆／敷療） */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px;cursor:pointer;font-family:inherit;color:var(--ink)}
.pick button .ph{min-height:80px;margin-bottom:6px}
.pick button b{display:block;font-size:.95rem}
.pick button.ok{border-color:var(--ok)}.pick button.ng{border-color:var(--ng)}
/* ===== 講解面板 ===== */
.exp{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.95rem;display:none}
.exp.show{display:block}
.exp.ok{background:#effaf3;border-left:5px solid var(--ok)}
.exp.ng{background:#fdf1f3;border-left:5px solid var(--ng)}
.exp.warn{background:#fff7e6;border-left:5px solid var(--warn)}
.exp.info{background:#eef4fc;border-left:5px solid var(--cold)}
.exp .t{font-weight:700;margin-bottom:4px}
.src{font-size:.78rem;color:var(--mut);margin-top:6px}
/* ===== PPE 拖放 ===== */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.slot{border:2px dashed #b8c2d0;border-radius:12px;min-height:110px;background:#f8fafc;position:relative;display:flex;align-items:center;justify-content:center;padding:4px}
.slot .n{position:absolute;top:4px;left:8px;font-size:.75rem;color:#8a95a5;font-weight:700}
.slot.over{border-color:var(--acc);background:#fff4ea}
.slot.ok{border-color:var(--ok);border-style:solid}.slot.ng{border-color:var(--ng);border-style:solid}
.pool{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(100px,auto);grid-template-rows:repeat(2,minmax(100px,auto));gap:8px;margin-top:10px;border:1px dashed #d5dce6;border-radius:12px;padding:6px}
.dcard{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;font-size:.8rem;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px;line-height:1.3}
.dcard .ph{min-height:44px;width:100%;padding:4px;font-size:.7rem;margin-bottom:4px;border-width:1px}
.dcard b{font-size:.8rem}
.dcard.sel{border-color:var(--acc);box-shadow:0 0 0 3px #fdebdd}
.dcard.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;width:82px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.slot .dcard{width:100%;cursor:grab}
.hint{font-size:.85rem;color:var(--mut);margin:6px 0}
/* ===== 回抽長按 ===== */
.asp{display:flex;gap:16px;align-items:flex-end;margin:12px 0}
.cyl{flex:0 0 70px;height:200px;border:3px solid #33415a;border-top:0;border-radius:0 0 14px 14px;position:relative;background:#fff;overflow:hidden}
.cyl .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#f2b7c2,#c81e3a);transition:none}
.cyl .tick{position:absolute;left:0;width:14px;height:2px;background:#33415a}
.cyl .lab{position:absolute;left:18px;font-size:.62rem;color:#33415a}
.aspinfo{flex:1}
.hold{width:100%;min-height:64px;font-size:1.1rem;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.hold.holding{background:#c25f1c}
.hold.done{background:var(--ok)}
.meter{height:10px;background:#eef2f7;border-radius:5px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:var(--acc);width:0}
/* ===== 後果頁（全螢幕覆蓋） ===== */
.ov{position:fixed;inset:0;background:rgba(20,10,12,.92);z-index:40;display:none;overflow:auto;padding:20px 16px}
.ov.show{display:block}
.ov .box{max-width:640px;margin:0 auto;background:#fff;border-radius:18px;padding:18px 16px;border-top:8px solid var(--ng)}
.ov .box.warn{border-top-color:var(--warn)}
.ov h2{margin:0 0 6px;color:var(--ng);font-size:1.2rem}
.ov .box.warn h2{color:#a26400}
.ov .ph{min-height:160px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:60;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
/* ===== 步驟總覽 ===== */
.steps{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.step .no{flex:0 0 32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .ph{flex:0 0 72px;min-height:54px;padding:4px;font-size:.65rem}
.step .tx{flex:1;font-size:.92rem}
.step .st{font-size:1.2rem}
.case{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;padding:16px;box-shadow:var(--sh);border-left:8px solid var(--acc);margin-bottom:12px;cursor:pointer;border-top:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-family:inherit}
.case.c2{border-left-color:var(--dmso)}
.case h2{margin:0 0 4px;font-size:1.1rem}.case p{margin:0;color:var(--mut);font-size:.9rem}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.78rem;background:#eef2f7;color:var(--mut);margin:2px 4px 0 0}
.err{background:#fdf1f3;border:1px solid #f3c2cb;border-radius:12px;padding:14px;color:#8e1530}
.paintwrap{position:relative;width:100%;margin:10px 0;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.paintwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.paintwrap #pnt{opacity:.5;cursor:crosshair;touch-action:none}
.pmeter{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem;margin:6px 0}
.pmeter span{background:#f3edf9;color:var(--dmso);border-radius:8px;padding:3px 10px;font-weight:700}
.btn.dm{background:var(--dmso)}
.keyp{margin:8px 0 0 0;padding-left:20px;font-size:.95rem}.keyp li{margin:3px 0}
.case.resume{border-left-color:var(--navy)}
.case.c3{border-left-color:var(--ok)}
.scn{font-size:2.6rem;line-height:1;margin:4px 0 6px}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:20px 16px}
@media (min-width:520px){.dcard{font-size:.85rem}.steps{grid-template-columns:1fr 1fr}}
</style>
</head>

<script id="qdata" type="application/json">{"source":"20260925_打掉重練_需求規格與題目草稿_階段1.md","count":8,"questions":[{"id":13,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"懷疑化療藥品外滲，第一個動作是什麼？","note":"","options":[{"key":"A","text":"立即停止給藥，但不要拔出靜脈留置針，並估計、記錄尚未注入的剩餘藥量"},{"key":"B","text":"立即停止給藥並拔針，用紗布壓住止血"},{"key":"C","text":"先降低滴速，觀察 15 分鐘再決定"}],"answer":"A","explain_ok":"答對了。立即停止給藥，留置針先不要拔，因為它是等一下回抽外滲藥品唯一的路徑。同時看一下點滴袋或注射器，估計還沒注入的剩餘藥量並記錄，這個數字是後面推算外滲量的依據。","explain_ng":"正確答案是立即停止給藥、不拔針、估計並記錄剩餘藥量。留置針是等一下回抽外滲藥品唯一的路徑，拔掉就沒得抽；降速觀察只是讓更多藥品進入組織。剩餘藥量要當下記，之後推算外滲量才有依據。","img":"s289–293（立即停止給藥）","form_item":"8","text_hash":{"ok":"2ffbd7af","ng":"4aff2dbc","stem":"de8150ca"}},{"id":14,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"處理外滲時要穿戴哪些防護裝備？","note":"","options":[{"key":"A","text":"防水隔離衣（後開式、長袖、袖口可束緊）、雙層丁腈或乳膠手套並套住袖口、外科口罩；有噴濺風險時加護目鏡或防護面罩"},{"key":"B","text":"一般隔離衣＋單層手套＋外科口罩"},{"key":"C","text":"只要戴手套就可以，因為藥量很少"}],"answer":"A","explain_ok":"答對了。外滲處理會直接接觸化療藥品，防護是四件：防水隔離衣、雙層手套套住袖口、外科口罩，有噴濺風險時加護目鏡或面罩。這是保護自己，也是每次處理外滲的標準起手式。","explain_ng":"正確答案是防水隔離衣、雙層手套套住袖口、外科口罩，有噴濺風險時加護目鏡或面罩。一般隔離衣不防水、單層手套不夠；藥量少不代表沒有暴露，回抽時噴到手、噴到眼的機會就在這幾分鐘。","img":"s285–288（穿著個人防護裝備）","form_item":"9","text_hash":{"ok":"448d8275","ng":"916054c2","stem":"87aaf40b"}},{"id":15,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"停止給藥後，接下來要怎麼做才能把外滲的藥品抽出來？","note":"","options":[{"key":"A","text":"移除裝有剩餘化療藥品的注射器或輸液套管，接上無菌 10 mL 注射器，從原靜脈注射處盡可能回抽到抽不出來為止，並估計回抽量"},{"key":"B","text":"直接用原本的注射器往回抽"},{"key":"C","text":"拔針後用針筒從皮下抽"}],"answer":"A","explain_ok":"答對了。先把還裝著化療藥品的注射器或輸液套管拆掉，換上一支無菌 10 mL 空針，從原來的留置針盡可能回抽，抽到抽不出來為止，並估計回抽出的外滲藥量。這就是為什麼前面不能先拔針。","explain_ng":"正確答案是換上無菌 10 mL 空針，從原留置針盡可能回抽並估計回抽量。原本的注射器裡還有藥，回抽會混在一起算不出量；拔針後從皮下抽會造成新的傷口，也抽不到血管內殘留的藥。","img":"s291–293（接上注射器，儘可能回抽）","form_item":"10、11","text_hash":{"ok":"ef855295","ng":"364ef148","stem":"033a227e"}},{"id":16,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"回抽完成後，留置針要怎麼處理？","note":"","options":[{"key":"A","text":"看有沒有解毒劑：有解毒劑就依醫囑準備，由醫師從原靜脈注射處注射後再拔針；沒有解毒劑就直接拔針"},{"key":"B","text":"一律立刻拔針"},{"key":"C","text":"一律保留留置針 24 小時觀察"}],"answer":"A","explain_ok":"答對了。拔不拔針取決於有沒有解毒劑。有解毒劑，原來的留置針就是醫師給解毒劑的路徑，要等注射完再拔；沒有解毒劑，就把針拔掉。本院目前多數化療藥品沒有解毒劑，實務上大多是回抽後拔針。","explain_ng":"正確答案是依解毒劑有無決定：有就由醫師從原針注射解毒劑後再拔，沒有就直接拔針。一律立刻拔會把解毒劑的給藥路徑拔掉；一律保留 24 小時則讓一支已經不在血管內的針留在組織裡，沒有好處。","img":"s305–309（醫療處置：解毒劑）、s312（移除針具）","form_item":"12","text_hash":{"ok":"205716cd","ng":"f666c343","stem":"c275bb12"}},{"id":17,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"外滲部位可以用手壓迫止血或按壓嗎？","note":"","options":[{"key":"A","text":"不可以，壓迫會讓外滲藥品擴大浸潤到周圍組織，起疱性藥品尤其危險"},{"key":"B","text":"可以，跟一般拔針一樣壓緊止血"}],"answer":"A","explain_ok":"答對了。外滲部位不要壓。壓迫會把已經在皮下的藥品推開，浸潤範圍變大，起疱性藥品一擴散就是更大面積的組織壞死。拔針後用紗布輕輕覆蓋即可。","explain_ng":"正確答案是不可以壓迫。這跟一般拔針不同，皮下有藥品時一壓就把藥推開，浸潤範圍變大；起疱性藥品一擴散就是更大面積的組織壞死。拔針後用紗布輕輕覆蓋即可。","img":"s304、s312–313（勿壓迫／紗布覆蓋）","form_item":"13","text_hash":{"ok":"5f06c2ac","ng":"ec99eb98","stem":"f1b8771c"}},{"id":18,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"為什麼要用油性筆把外滲範圍標示出來？","note":"","options":[{"key":"A","text":"標出當下的外滲邊界，之後才能比較範圍有沒有擴大，也是拍照與交班的依據"},{"key":"B","text":"提醒同事不要在這隻手打針"}],"answer":"A","explain_ok":"答對了。油性筆沿著外滲邊界畫一圈，是替「現在」留下記號。之後每天觀察、拍照上傳、交班，都拿這條線比對範圍有沒有擴大。要用油性筆是因為不會被汗水或敷料擦掉。","explain_ng":"正確答案是標出當下的外滲邊界，供後續比較與拍照交班。油性筆的線是「現在」的記號，之後每天觀察、拍照、交班都拿它比對範圍有沒有擴大；用油性筆是因為不會被汗水或敷料擦掉。","img":"s325（限制藥品擴散到周圍組織）※待核是否有油性筆畫面","form_item":"14","text_hash":{"ok":"32c7c8ec","ng":"e8996ed1","stem":"5b72e157"}},{"id":19,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"外滲部位要冰敷還是熱敷？","note":"","options":[{"key":"A","text":"依外滲的藥品種類決定，要查「各類化療藥品外滲處置方法」"},{"key":"B","text":"一律冰敷，因為可以消腫止痛"},{"key":"C","text":"一律熱敷，因為可以促進吸收"}],"answer":"A","explain_ok":"答對了。冰敷或熱敷不是看腫不腫，是看藥品。多數起疱性藥品用冰敷讓藥品局限在局部；少數藥品（例如 Vinca alkaloid 類、Oxaliplatin）反而要熱敷幫助擴散吸收，冰敷會加重傷害。所以一定要查表，不憑印象。","explain_ng":"正確答案是依藥品種類決定並查表。冰敷或熱敷不是看腫不腫，是看藥品：多數起疱性藥品用冰敷，但 Vinca alkaloid 類與 Oxaliplatin 要熱敷，用錯方向會加重傷害。不憑印象，查「各類化療藥品外滲處置方法」。","img":"s316–322、s329–332（敷療／敷療方式）","form_item":"15","text_hash":{"ok":"d24b96a5","ng":"39462f54","stem":"2675d46f"}},{"id":20,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"哪一類化療藥品外滲時，可依醫囑在局部塗抹 DMSO？","note":"","options":[{"key":"A","text":"Anthracycline 類（Doxorubicin、Idarubicin、Epirubicin、Daunorubicin）與抗生素類（Mitomycin-C）"},{"key":"B","text":"所有起疱性化療藥品都可以"},{"key":"C","text":"鉑類藥品（Cisplatin、Oxaliplatin）"}],"answer":"A","explain_ok":"答對了。DMSO 是針對 Anthracycline 類與 Mitomycin-C 外滲的局部處置，依醫囑塗抹，使用方法要看「DMSO 化療藥品外滲使用需知」。其他藥品外滲不是用 DMSO 處理。","explain_ng":"正確答案是 Anthracycline 類與 Mitomycin-C。DMSO 不是所有起疱性藥品通用，鉑類也不是它的適應症；只有 Anthracycline 類與 Mitomycin-C 外滲時依醫囑局部塗抹，用法看「DMSO 化療藥品外滲使用需知」。","img":"s329–332（敷療方式）※待核是否有 DMSO 頁","form_item":"16","text_hash":{"ok":"6bfc4627","ng":"12d0fd23","stem":"170b23f4"}}]}</script>

const result = {};   // key → {tries, first:true/false, seen:[後果卡]}
function rec(key){ return result[key] || (result[key] = {tries:0, first:null, seen:[]}); }
function mark(key, ok, cq){
  const r = rec(key); r.tries++;

}

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ph(id, cap, desc, cls){
  // 圖卡佔位：先文字卡；若 h_<id>.png 存在則 onload 換圖

function toast(msg, ms){

}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function optList(q){

function bindOpts(q, handler, root){

function expBox(cls, title, text, src){

function nextBtn(label){ return `<div class="btnrow"><button class="btn wide" id="next">${label||'下一步 →'}</button></div>`; }
function bindNext(){ const b = $('#next'); if (b) b.addEventListener('click', () => go(pos+1)); }

function dcard(p){ return `<div class="dcard" data-id="${p.id}">${ph(p.id, p.name, '', 'small nocap')}<b>${esc(p.name)}</b>${p.sub?`<span style="color:var(--mut);font-size:.68rem">${esc(p.sub)}</span>`:''}</div>`; }

/* --- 通用拖放：Pointer Events（手機觸控可用）＋ 點卡再點格 的備援 --- */
let dnd = {on:false};
function initDnD(){
  dnd = {on:true, drag:null, ghost:null, sel:null, justDragged:false};
  const app = $('#app');
  app.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, {passive:false});
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
  app.addEventListener('contextmenu', e => { if (e.target.closest('.dcard')) e.preventDefault(); });
  app.addEventListener('click', onTap);
  updateChk();
}
function disableDnD(){ dnd.on = false; document.querySelectorAll('.dcard').forEach(c => c.style.cursor='default'); }
function onDown(e){
  if (!dnd.on) return; const c = e.target.closest('.dcard'); if (!c) return;
  dnd.drag = {card:c, x0:e.clientX, y0:e.clientY, moved:false, pid:e.pointerId};
}
function onMove(e){
  const d = dnd.drag; if (!d || e.pointerId !== d.pid) return;
  if (!d.moved) { if (Math.hypot(e.clientX-d.x0, e.clientY-d.y0) < 6) return; d.moved = true;
    const g = d.card.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); d.ghost = g; d.card.style.opacity = '.35'; }
  e.preventDefault();
  d.ghost.style.left = e.clientX+'px'; d.ghost.style.top = e.clientY+'px';
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('over'));
  const t = targetAt(e.clientX, e.clientY); if (t && t.classList.contains('slot')) t.classList.add('over');
}
function onUp(e){
  const d = dnd.drag; if (!d || e.pointerId !== d.pid) return;
  dnd.drag = null;
  if (!d.moved) return;                       // 沒移動 → 交給 click（點選備援）
  d.ghost.remove(); d.card.style.opacity = '';
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('over'));
  const t = targetAt(e.clientX, e.clientY);
  if (t) place(d.card, t);
  dnd.justDragged = true; setTimeout(()=>dnd.justDragged=false, 80);
}
function targetAt(x, y){
  const el = document.elementFromPoint(x, y); if (!el) return null;
  return el.closest('.slot') || el.closest('#pool');
}
function place(card, target){
  if (target.classList.contains('slot')) {
    const occ = target.querySelector('.dcard');
    if (occ && occ !== card) { card.parentNode.appendChild(occ); } // 交換：目標格已有卡 → 換到來源位置
    target.appendChild(card);
  } else { $('#pool').appendChild(card); }
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('ok','ng'));
  updateChk();
}
function onTap(e){
  if (!dnd.on || dnd.justDragged) return;
  const c = e.target.closest('.dcard');
  if (c) { if (dnd.sel === c) { c.classList.remove('sel'); dnd.sel = null; if (c.parentNode.classList.contains('slot')) place(c, $('#pool')); return; } // 已選的格內卡再點一次＝放回
    document.querySelectorAll('.dcard.sel').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); dnd.sel = c;
    toast(c.parentNode.classList.contains('slot') ? '再點一個格子可交換；再點同一張＝放回' : '再點上面任一格放進去', 1600); return; }
  const s = e.target.closest('.slot') || e.target.closest('#pool');
  if (s && dnd.sel) { place(dnd.sel, s); dnd.sel.classList.remove('sel'); dnd.sel = null; }
}
function updateChk(){ const b = $('#chk'); if (b) b.disabled = document.querySelectorAll('.slot .dcard').length < 4; }

    <div id="fb"></div></div>`;
  const hold = $('#hold'), fill = $('#fill'), mt = $('#mt'), vol = $('#vol');
  let t0 = null, raf = null, done = false, pid = null;

  function start(e){ if (done) return; e.preventDefault(); pid = e.pointerId; try{ hold.setPointerCapture(pid); }catch(_){} t0 = performance.now(); hold.classList.add('holding'); hold.textContent = '回抽中…不要放開'; raf = requestAnimationFrame(frame); }
  function stop(){ if (done || t0 === null) return; cancelAnimationFrame(raf); t0 = null;
    hold.classList.remove('holding'); hold.textContent = '🩸 按住回抽';
    fill.style.height = '0'; mt.style.width = '0'; vol.textContent = '回抽量：0 mL';
    mark('asp', false); toast('太早放開了：要抽盡並估量', 2600); }
  function finish(){ done = true; t0 = null; hold.classList.remove('holding'); hold.classList.add('done'); hold.textContent = '✓ 抽不出了'; mark('asp', true);
    $('#fb').innerHTML = expBox('ok', `完成：回抽到抽不出為止，估計回抽量約 ${MAXML} mL，記錄下來`, q.explain_ok, srcQ(q)) + nextBtn(); bindNext(); }
  hold.addEventListener('pointerdown', start);
  hold.addEventListener('pointerup', stop); hold.addEventListener('pointercancel', stop);
  hold.addEventListener('contextmenu', e => e.preventDefault());
};

/* DMSO 塗抹範圍：在前臂上用手指／滑鼠塗，檢查是否塗到約兩倍範圍 */
RENDER.paint = () => {
  $('#app').innerHTML = `<div class="card"><span class="badge acc">動手塗</span><span class="badge">DMSO 範圍</span>
    <div class="stem">動手塗一次：DMSO 要塗到多大？</div>
    <p class="hint">黑色虛線＝油性筆畫的外滲範圍（${PAINT_SPOT.w}×${PAINT_SPOT.h} cm）。用<b>手指或滑鼠</b>在手臂上塗 DMSO，塗到你認為的<b>患部兩倍範圍</b>，再按「檢查」。</p>
    <div class="paintwrap" id="pw"><canvas id="pbg"></canvas><canvas id="pnt"></canvas></div>
    <div class="pmeter" id="pm"></div>
    <div class="btnrow"><button class="btn sec" id="pclr">🧽 擦掉重塗</button><button class="btn sec" id="pshow">👁 顯示正確範圍</button></div>
    <div class="btnrow"><button class="btn dm wide" id="pchk" disabled>檢查</button></div>
    <div id="fb"></div></div>`;
  const pw = $('#pw'), bg = $('#pbg'), pc = $('#pnt');
  let W = 0, H = 0, dpr = 1, strokes = [], cur = null, showT = false, locked = false;
  const geo = () => ({cx:W*0.52, cy:H*0.55, cm:W*0.07});   // 1 cm＝畫布寬 7%
  function spot(){ const g = geo(); return {cx:g.cx, cy:g.cy, a:PAINT_SPOT.w/2*g.cm, b:PAINT_SPOT.h/2*g.cm}; }
  function target(){ const s = spot(); return {cx:s.cx, cy:s.cy, a:s.a*DMSO_SCALE, b:s.b*DMSO_SCALE}; }
  const brush = () => Math.max(8, W*0.02);
  const font = (k, wt) => `${wt||700} ${Math.max(13, Math.round(W*k))}px "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif`;
  function size(){
    W = pw.clientWidth; H = Math.round(W*0.62); pw.style.height = H+'px'; dpr = window.devicePixelRatio || 1;
    [bg, pc].forEach(c => { c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); });
    drawBg(); redrawPaint();
  }
  function drawBg(){
    const c = bg.getContext('2d'); c.clearRect(0,0,W,H);
    c.fillStyle = '#f7f9fc'; c.fillRect(0,0,W,H);
    // 前臂（左＝手肘、右＝手腕；掌面朝上）
    const gr = c.createLinearGradient(0,H*0.12,0,H*0.96); gr.addColorStop(0,'#e5b392'); gr.addColorStop(.35,'#f4d0b5'); gr.addColorStop(.7,'#f3cdb0'); gr.addColorStop(1,'#dca783');
    c.fillStyle = gr; c.strokeStyle = '#c98f6d'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0,H*0.13); c.bezierCurveTo(W*0.35,H*0.16,W*0.7,H*0.21,W*0.9,H*0.25);
    c.lineTo(W,H*0.26); c.lineTo(W,H*0.85); c.lineTo(W*0.9,H*0.85);
    c.bezierCurveTo(W*0.7,H*0.88,W*0.35,H*0.93,0,H*0.97); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(201,143,109,.6)'; c.lineWidth = 2;   // 手腕摺痕
    c.beginPath(); c.moveTo(W*0.9,H*0.28); c.quadraticCurveTo(W*0.915,H*0.55,W*0.9,H*0.82); c.stroke();
    c.fillStyle = '#5b6675'; c.font = font(0.032); c.textBaseline = 'top';
    c.textAlign = 'left'; c.fillText('◀ 手肘', 8, 6); c.textAlign = 'right'; c.fillText('手腕 ▶', W-8, 6);
    // 紅腫的外滲患部＋油性筆虛線
    const s = spot();
    const rg = c.createRadialGradient(s.cx,s.cy,0,s.cx,s.cy,s.a); rg.addColorStop(0,'rgba(214,72,72,.45)'); rg.addColorStop(1,'rgba(214,72,72,.12)');
    c.fillStyle = rg; c.beginPath(); c.ellipse(s.cx,s.cy,s.a,s.b,0,0,Math.PI*2); c.fill();
    c.setLineDash([7,5]); c.strokeStyle = '#1c2430'; c.lineWidth = 3; c.stroke(); c.setLineDash([]);
    c.fillStyle = '#1c2430'; c.font = font(0.026); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(`外滲 ${PAINT_SPOT.w}×${PAINT_SPOT.h} cm`, s.cx, s.cy);
    if (showT) {
      const t = target();
      c.setLineDash([10,6]); c.strokeStyle = '#7a3fb5'; c.lineWidth = 4;
      c.beginPath(); c.ellipse(t.cx,t.cy,t.a,t.b,0,0,Math.PI*2); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#7a3fb5'; c.font = font(0.028, 800); c.textAlign = 'center'; c.textBaseline = 'bottom';
      c.fillText('DMSO 塗抹範圍（約兩倍）', t.cx, t.cy - t.b - 4);
    }
    c.textAlign = 'left';
  }
  function dot(c, x, y){ c.beginPath(); c.arc(x*W, y*H, brush(), 0, Math.PI*2); c.fill(); }
  function seg(c, p, q){ const d = Math.hypot((q[0]-p[0])*W, (q[1]-p[1])*H), n = Math.max(1, Math.ceil(d/(brush()*0.4)));
    for (let i=1;i<=n;i++) dot(c, p[0]+(q[0]-p[0])*i/n, p[1]+(q[1]-p[1])*i/n); }
  function redrawPaint(){ const c = pc.getContext('2d'); c.clearRect(0,0,W,H); c.fillStyle = '#7a3fb5';
    strokes.forEach(st => { dot(c, st[0][0], st[0][1]); for (let i=1;i<st.length;i++) seg(c, st[i-1], st[i]); }); }
  const pt = e => { const r = pc.getBoundingClientRect(); return [(e.clientX-r.left)/W, (e.clientY-r.top)/H]; };
  pc.addEventListener('pointerdown', e => { if (locked) return; e.preventDefault(); try{ pc.setPointerCapture(e.pointerId); }catch(_){}
    cur = [pt(e)]; strokes.push(cur); const c = pc.getContext('2d'); c.fillStyle = '#7a3fb5'; dot(c, cur[0][0], cur[0][1]); $('#pchk').disabled = false; });
  pc.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); const p = pt(e), c = pc.getContext('2d'); c.fillStyle = '#7a3fb5'; seg(c, cur[cur.length-1], p); cur.push(p); });
  ['pointerup','pointercancel'].forEach(t => pc.addEventListener(t, () => { cur = null; }));
  const clearPaint = () => { strokes = []; redrawPaint(); $('#pm').innerHTML = ''; $('#pchk').disabled = true; };
  $('#pclr').onclick = () => { if (!locked) clearPaint(); };
  $('#pshow').onclick = () => { showT = !showT; $('#pshow').textContent = showT ? '🙈 隱藏正確範圍' : '👁 顯示正確範圍'; drawBg(); };
  function score(){
    // 格點取樣：兩倍區內被塗到的比例、兩倍區外被塗到的面積（相對兩倍區面積）
    const t = target(), img = pc.getContext('2d').getImageData(0,0,pc.width,pc.height).data, step = Math.max(3, W/160);
    let inT = 0, inP = 0, outP = 0;
    for (let y=step/2; y<H; y+=step) for (let x=step/2; x<W; x+=step) {
      const px = Math.min(pc.width-1, Math.round(x*dpr)), py = Math.min(pc.height-1, Math.round(y*dpr));
      const painted = img[(py*pc.width+px)*4+3] > 40;
      const inside = ((x-t.cx)/t.a)**2 + ((y-t.cy)/t.b)**2 <= 1;
      if (inside) { inT++; if (painted) inP++; } else if (painted) outP++;
    }
    return {cover: inP/inT, outside: outP/inT};
  }
  const KEYP = `<ul class="keyp"><li>範圍：外滲患部的<b>兩倍</b>大（從油性筆範圍往外擴）</li><li>塗完<b>自然風乾，不要覆蓋</b>（不包紗布、不包保鮮膜）</li><li><b>一天 4 次，連續 7 天</b>；同時冰敷 20 分鐘、一天 4 次、1–2 天</li><li>塗抹時<b>戴手套</b></li><li>只用於 Anthracycline 類（Doxorubicin、Epirubicin、Idarubicin、Daunorubicin）與 Mitomycin-C、Mitoxantrone</li></ul>`;
  const SRC = '查詢站 Doxorubicin 列（院內〈化療藥品外滲處置建議〉2023.5 版）';
  function pass(title, cls){
    locked = true; showT = true; drawBg(); $('#pshow').textContent = '🙈 隱藏正確範圍'; $('#pchk').disabled = true;
    $('#fb').innerHTML = `<div class="exp ${cls} show"><div class="t">${esc(title)}</div>${KEYP}<div class="src">${esc(SRC)}</div></div>` + nextBtn(); bindNext();
  }
  $('#pchk').onclick = () => {
    const r = score(), cv = Math.round(r.cover*100), ou = Math.round(r.outside*100);
    $('#pm').innerHTML = `<span>兩倍範圍塗到 ${cv}%</span><span>塗出範圍外 ${ou}%</span>`;
    if (r.cover >= PAINT_PASS_COVER && r.outside <= PAINT_MAX_OUTSIDE) { mark('paint', true); pass('塗對了：範圍約患部兩倍', 'ok'); return; }
    mark('paint', false);
    let title, text;
    if (r.cover < PAINT_PASS_COVER && r.outside <= PAINT_MAX_OUTSIDE) { title = '塗太小了'; text = '只塗紅腫的地方不夠：DMSO 要塗到患部的兩倍範圍，油性筆虛線外面也要塗。'; }
    else if (r.cover >= PAINT_PASS_COVER) { title = '塗太大了'; text = '兩倍範圍就夠了，不需要塗整隻手臂；塗太大只會增加皮膚刺激。'; }
    else { title = '位置偏了'; text = '以油性筆畫的外滲範圍為中心，往四周擴大到約兩倍，均勻塗滿。'; }
    showCQ({title, text, src:SRC, warn:true, retryLabel:'擦掉重塗', allowSkip: rec('paint').tries >= 2, skipLabel:'看正確範圍並繼續',
      onRetry: clearPaint, onSkip: () => pass('正確範圍：紫色虛線（約患部兩倍）', 'ng')});
  };
  new ResizeObserver(() => { if (pw.clientWidth && pw.clientWidth !== W) size(); }).observe(pw);
  size();
};

/* ---------- 進度保存／還原（去查詢站再回來不用重做） ----------
   存：案例（flow）、步驟（pos）、每步作答紀錄（result）、該步是否已點過查詢站／「我查過了」（revealed）。
   位置：sessionStorage（同分頁返回）＋ localStorage 備援（新分頁或 App 內嵌開啟時；6 小時內有效）。
   還原時機：網址帶 ?resume=1、瀏覽器「上一頁」返回（重新載入時）；bfcache 返回則頁面原樣保留。
   一般從首頁進入不自動還原，而是在案例選單上方出現「繼續上次進度」。 */
const SKEY = 'handson_state_v1', STTL = 6*3600*1000;
const FLOWS = {'1': FLOW1, '2': FLOW2, '3': FLOW3};
let revealedKey = null;
function saveState(){
  if (!flow) return;
  const st = {flow: flow===FLOW1 ? '1' : flow===FLOW2 ? '2' : '3', pos, result, revealed: revealedKey === flow[pos] ? revealedKey : null, ts: Date.now()};
  const j = JSON.stringify(st);
  try{ sessionStorage.setItem(SKEY, j); }catch(e){}
  try{ localStorage.setItem(SKEY, j); }catch(e){}
}
function loadState(){
  let j = null;
  try{ j = sessionStorage.getItem(SKEY); }catch(e){}
  if (!j) { try{ j = localStorage.getItem(SKEY); }catch(e){} }
  if (!j) return null;
  try{
    const st = JSON.parse(j);
    if (!st || !FLOWS[st.flow] || !(Date.now()-st.ts < STTL)) return null;
    if (!(st.pos >= 0 && st.pos < FLOWS[st.flow].length)) return null;
    return st;
  }catch(e){ return null; }
}
function restore(st){
  for (const k in result) delete result[k];
  Object.assign(result, st.result || {});
  flow = FLOWS[st.flow];
  revealedKey = st.revealed || null;
  go(st.pos);
  if (revealedKey && revealedKey === flow[pos]) { const b = $('#checked'); if (b) b.click(); }
}
function bindLookup(reveal){
  // 連到查詢站：同分頁開、網址帶 ret＝目前步驟；點之前先存進度（含「已查詢」）
  const a = $('#lk'); if (!a) return;
  a.href = `../lookup/?from=handson&ret=${encodeURIComponent(flow[pos])}`;
  a.addEventListener('click', () => { revealedKey = flow[pos]; saveState(); setTimeout(reveal, 300); });
  const c = $('#checked'); if (c) c.addEventListener('click', () => { revealedKey = flow[pos]; saveState(); });
}
function wantResume(){
  if (new URLSearchParams(location.search).get('resume') === '1') return true;
  try{ const nav = performance.getEntriesByType('navigation')[0]; if (nav && nav.type === 'back_forward') return true; }catch(e){}
  return false;
}

    <div class="steps" style="margin-top:12px"><div class="step"><div class="no">9</div>${ph('st09', STEPS9[8].t, '', 'small nocap')}<div class="tx">${esc(STEPS9[8].t)}</div><div class="st">${n===3?'✅':'🔁'}</div></div></div>
    <div class="btnrow"><button class="btn" id="go1">回案例一從頭做 →</button><button class="btn sec" id="again">案例二再玩一次</button><a class="btn sec" href="../">回首頁</a></div></div>`;

/* ---------- 啟動：讀題庫 ---------- */
function loadEmbedded(){ // fetch 失敗（file:// 直接開）時，退而讀 build 注入的內嵌題庫；空的就丟錯
  const t = document.getElementById('qdata').textContent.trim(); if (!t) throw new Error('Failed to fetch');
  return JSON.parse(t);
}
fetch(DATA_URL, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(loadEmbedded).then(d => {
  d.questions.forEach(q => { Q[q.id] = q; });
  const missing = [13,14,15,16,17,18,19,20].filter(id => !Q[id]);
  if (missing.length) throw new Error('題庫缺 Q' + missing.join('、Q'));
  const st = wantResume() ? loadState() : null;
  if (st) { restore(st); try{ history.replaceState(null, '', location.pathname); }catch(e){} }
  else home();
}).catch(err => {
  $('#app').innerHTML = `<div class="err"><b>題庫載入失敗</b>（${esc(err.message)}）。<br>本頁的題目文字來自 <code>assets/data/questions.json</code>，直接雙擊 HTML 用 <code>file://</code> 開會被瀏覽器擋住。<br><b>本機預覽</b>：雙擊同資料夾的 <code>_preview.bat</code>（會啟動本機伺服器並自動開頁），或等 S0 推上 GitHub Pages 後用網址開。</div>`;
});
