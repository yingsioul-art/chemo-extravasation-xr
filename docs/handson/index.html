<style>

<script id="qdata" type="application/json">{"source":"20260925_打掉重練_需求規格與題目草稿_階段1.md","count":8,"questions":[{"id":13,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"懷疑化療藥品外滲，第一個動作是什麼？","note":"","options":[{"key":"A","text":"立即停止給藥，但不要拔出靜脈留置針，並估計、記錄尚未注入的剩餘藥量"},{"key":"B","text":"立即停止給藥並拔針，用紗布壓住止血"},{"key":"C","text":"先降低滴速，觀察 15 分鐘再決定"}],"answer":"A","explain_ok":"答對了。立即停止給藥，留置針先不要拔，因為它是等一下回抽外滲藥品唯一的路徑。同時看一下點滴袋或注射器，估計還沒注入的剩餘藥量並記錄，這個數字是後面推算外滲量的依據。","explain_ng":"正確答案是立即停止給藥、不拔針、估計並記錄剩餘藥量。留置針是等一下回抽外滲藥品唯一的路徑，拔掉就沒得抽；降速觀察只是讓更多藥品進入組織。剩餘藥量要當下記，之後推算外滲量才有依據。","img":"s289–293（立即停止給藥）","form_item":"8","text_hash":{"ok":"2ffbd7af","ng":"4aff2dbc","stem":"de8150ca"}},{"id":14,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"處理外滲時要穿戴哪些防護裝備？","note":"","options":[{"key":"A","text":"防水隔離衣（後開式、長袖、袖口可束緊）、雙層丁腈或乳膠手套並套住袖口、外科口罩；有噴濺風險時加護目鏡或防護面罩"},{"key":"B","text":"一般隔離衣＋單層手套＋外科口罩"},{"key":"C","text":"只要戴手套就可以，因為藥量很少"}],"answer":"A","explain_ok":"答對了。外滲處理會直接接觸化療藥品，防護是四件：防水隔離衣、雙層手套套住袖口、外科口罩，有噴濺風險時加護目鏡或面罩。這是保護自己，也是每次處理外滲的標準起手式。","explain_ng":"正確答案是防水隔離衣、雙層手套套住袖口、外科口罩，有噴濺風險時加護目鏡或面罩。一般隔離衣不防水、單層手套不夠；藥量少不代表沒有暴露，回抽時噴到手、噴到眼的機會就在這幾分鐘。","img":"s285–288（穿著個人防護裝備）","form_item":"9","text_hash":{"ok":"448d8275","ng":"916054c2","stem":"87aaf40b"}},{"id":15,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"停止給藥後，接下來要怎麼做才能把外滲的藥品抽出來？","note":"","options":[{"key":"A","text":"移除裝有剩餘化療藥品的注射器或輸液套管，接上無菌 10 mL 注射器，從原靜脈注射處盡可能回抽到抽不出來為止，並估計回抽量"},{"key":"B","text":"直接用原本的注射器往回抽"},{"key":"C","text":"拔針後用針筒從皮下抽"}],"answer":"A","explain_ok":"答對了。先把還裝著化療藥品的注射器或輸液套管拆掉，換上一支無菌 10 mL 空針，從原來的留置針盡可能回抽，抽到抽不出來為止，並估計回抽出的外滲藥量。這就是為什麼前面不能先拔針。","explain_ng":"正確答案是換上無菌 10 mL 空針，從原留置針盡可能回抽並估計回抽量。原本的注射器裡還有藥，回抽會混在一起算不出量；拔針後從皮下抽會造成新的傷口，也抽不到血管內殘留的藥。","img":"s291–293（接上注射器，儘可能回抽）","form_item":"10、11","text_hash":{"ok":"ef855295","ng":"364ef148","stem":"033a227e"}},{"id":16,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"回抽完成後，留置針要怎麼處理？","note":"","options":[{"key":"A","text":"看有沒有解毒劑：有解毒劑就依醫囑準備，由醫師從原靜脈注射處注射後再拔針；沒有解毒劑就直接拔針"},{"key":"B","text":"一律立刻拔針"},{"key":"C","text":"一律保留留置針 24 小時觀察"}],"answer":"A","explain_ok":"答對了。拔不拔針取決於有沒有解毒劑。有解毒劑，原來的留置針就是醫師給解毒劑的路徑，要等注射完再拔；沒有解毒劑，就把針拔掉。本院目前多數化療藥品沒有解毒劑，實務上大多是回抽後拔針。","explain_ng":"正確答案是依解毒劑有無決定：有就由醫師從原針注射解毒劑後再拔，沒有就直接拔針。一律立刻拔會把解毒劑的給藥路徑拔掉；一律保留 24 小時則讓一支已經不在血管內的針留在組織裡，沒有好處。","img":"s305–309（醫療處置：解毒劑）、s312（移除針具）","form_item":"12","text_hash":{"ok":"205716cd","ng":"f666c343","stem":"c275bb12"}},{"id":17,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"外滲部位可以用手壓迫止血或按壓嗎？","note":"","options":[{"key":"A","text":"不可以，壓迫會讓外滲藥品擴大浸潤到周圍組織，起疱性藥品尤其危險"},{"key":"B","text":"可以，跟一般拔針一樣壓緊止血"}],"answer":"A","explain_ok":"答對了。外滲部位不要壓。壓迫會把已經在皮下的藥品推開，浸潤範圍變大，起疱性藥品一擴散就是更大面積的組織壞死。拔針後用紗布輕輕覆蓋即可。","explain_ng":"正確答案是不可以壓迫。這跟一般拔針不同，皮下有藥品時一壓就把藥推開，浸潤範圍變大；起疱性藥品一擴散就是更大面積的組織壞死。拔針後用紗布輕輕覆蓋即可。","img":"s304、s312–313（勿壓迫／紗布覆蓋）","form_item":"13","text_hash":{"ok":"5f06c2ac","ng":"ec99eb98","stem":"f1b8771c"}},{"id":18,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"為什麼要用油性筆把外滲範圍標示出來？","note":"","options":[{"key":"A","text":"標出當下的外滲邊界，之後才能比較範圍有沒有擴大，也是拍照與交班的依據"},{"key":"B","text":"提醒同事不要在這隻手打針"}],"answer":"A","explain_ok":"答對了。油性筆沿著外滲邊界畫一圈，是替「現在」留下記號。之後每天觀察、拍照上傳、交班，都拿這條線比對範圍有沒有擴大。要用油性筆是因為不會被汗水或敷料擦掉。","explain_ng":"正確答案是標出當下的外滲邊界，供後續比較與拍照交班。油性筆的線是「現在」的記號，之後每天觀察、拍照、交班都拿它比對範圍有沒有擴大；用油性筆是因為不會被汗水或敷料擦掉。","img":"s325（限制藥品擴散到周圍組織）※待核是否有油性筆畫面","form_item":"14","text_hash":{"ok":"32c7c8ec","ng":"e8996ed1","stem":"5b72e157"}},{"id":19,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"外滲部位要冰敷還是熱敷？","note":"","options":[{"key":"A","text":"依外滲的藥品種類決定，要查「各類化療藥品外滲處置方法」"},{"key":"B","text":"一律冰敷，因為可以消腫止痛"},{"key":"C","text":"一律熱敷，因為可以促進吸收"}],"answer":"A","explain_ok":"答對了。冰敷或熱敷不是看腫不腫，是看藥品。多數起疱性藥品用冰敷讓藥品局限在局部；少數藥品（例如 Vinca alkaloid 類、Oxaliplatin）反而要熱敷幫助擴散吸收，冰敷會加重傷害。所以一定要查表，不憑印象。","explain_ng":"正確答案是依藥品種類決定並查表。冰敷或熱敷不是看腫不腫，是看藥品：多數起疱性藥品用冰敷，但 Vinca alkaloid 類與 Oxaliplatin 要熱敷，用錯方向會加重傷害。不憑印象，查「各類化療藥品外滲處置方法」。","img":"s316–322、s329–332（敷療／敷療方式）","form_item":"15","text_hash":{"ok":"d24b96a5","ng":"39462f54","stem":"2675d46f"}},{"id":20,"block":"E","block_name":"初步處理","use":["handson","test"],"stem":"哪一類化療藥品外滲時，可依醫囑在局部塗抹 DMSO？","note":"","options":[{"key":"A","text":"Anthracycline 類（Doxorubicin、Idarubicin、Epirubicin、Daunorubicin）與抗生素類（Mitomycin-C）"},{"key":"B","text":"所有起疱性化療藥品都可以"},{"key":"C","text":"鉑類藥品（Cisplatin、Oxaliplatin）"}],"answer":"A","explain_ok":"答對了。DMSO 是針對 Anthracycline 類與 Mitomycin-C 外滲的局部處置，依醫囑塗抹，使用方法要看「DMSO 化療藥品外滲使用需知」。其他藥品外滲不是用 DMSO 處理。","explain_ng":"正確答案是 Anthracycline 類與 Mitomycin-C。DMSO 不是所有起疱性藥品通用，鉑類也不是它的適應症；只有 Anthracycline 類與 Mitomycin-C 外滲時依醫囑局部塗抹，用法看「DMSO 化療藥品外滲使用需知」。","img":"s329–332（敷療方式）※待核是否有 DMSO 頁","form_item":"16","text_hash":{"ok":"6bfc4627","ng":"12d0fd23","stem":"170b23f4"}}]}</script>

const FLOW1 = ['scene1','d1','ppe','syr','asp','anti','press','pen','comp','sum1'];

let flow = null, pos = 0;
const result = {};   // key → {tries, first:true/false, seen:[後果卡]}
function rec(key){ return result[key] || (result[key] = {tries:0, first:null, seen:[]}); }

  if (r.first === null) r.first = ok;
  if (cq && !r.seen.includes(cq)) r.seen.push(cq);
}

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);

}

}

/* ---------- 導覽 ---------- */

/* --- 通用拖放：Pointer Events（手機觸控可用）＋ 點卡再點格 的備援 --- */
let dnd = {on:false};
function initDnD(){
  dnd = {on:true, drag:null, ghost:null, sel:null, justDragged:false};
  const app = $('#app');
  app.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, {passive:false});
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
  app.addEventListener('contextmenu', e => { if (e.target.closest('.dcard')) e.preventDefault(); });
  app.addEventListener('click', onTap);
  updateChk();
}
function disableDnD(){ dnd.on = false; document.querySelectorAll('.dcard').forEach(c => c.style.cursor='default'); }
function onDown(e){
  if (!dnd.on) return; const c = e.target.closest('.dcard'); if (!c) return;
  dnd.drag = {card:c, x0:e.clientX, y0:e.clientY, moved:false, pid:e.pointerId};
}
function onMove(e){
  const d = dnd.drag; if (!d || e.pointerId !== d.pid) return;
  if (!d.moved) { if (Math.hypot(e.clientX-d.x0, e.clientY-d.y0) < 6) return; d.moved = true;
    const g = d.card.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); d.ghost = g; d.card.style.opacity = '.35'; }
  e.preventDefault();
  d.ghost.style.left = e.clientX+'px'; d.ghost.style.top = e.clientY+'px';
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('over'));
  const t = targetAt(e.clientX, e.clientY); if (t && t.classList.contains('slot')) t.classList.add('over');
}
function onUp(e){
  const d = dnd.drag; if (!d || e.pointerId !== d.pid) return;
  dnd.drag = null;
  if (!d.moved) return;                       // 沒移動 → 交給 click（點選備援）
  d.ghost.remove(); d.card.style.opacity = '';
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('over'));
  const t = targetAt(e.clientX, e.clientY);
  if (t) place(d.card, t);
  dnd.justDragged = true; setTimeout(()=>dnd.justDragged=false, 80);
}
function targetAt(x, y){
  const el = document.elementFromPoint(x, y); if (!el) return null;
  return el.closest('.slot') || el.closest('#pool');
}
function place(card, target){
  if (target.classList.contains('slot')) {
    const occ = target.querySelector('.dcard');
    if (occ && occ !== card) { card.parentNode.appendChild(occ); } // 交換：目標格已有卡 → 換到來源位置
    target.appendChild(card);
  } else { $('#pool').appendChild(card); }
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('ok','ng'));
  updateChk();
}
function onTap(e){
  if (!dnd.on || dnd.justDragged) return;
  const c = e.target.closest('.dcard');
  if (c) { if (dnd.sel === c) { c.classList.remove('sel'); dnd.sel = null; if (c.parentNode.classList.contains('slot')) place(c, $('#pool')); return; } // 已選的格內卡再點一次＝放回
    document.querySelectorAll('.dcard.sel').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); dnd.sel = c;
    toast(c.parentNode.classList.contains('slot') ? '再點一個格子可交換；再點同一張＝放回' : '再點上面任一格放進去', 1600); return; }
  const s = e.target.closest('.slot') || e.target.closest('#pool');
  if (s && dnd.sel) { place(dnd.sel, s); dnd.sel.classList.remove('sel'); dnd.sel = null; }
}
function updateChk(){ const b = $('#chk'); if (b) b.disabled = document.querySelectorAll('.slot .dcard').length < 4; }

    <div id="fb"></div></div>`;
  const hold = $('#hold'), fill = $('#fill'), mt = $('#mt'), vol = $('#vol');
  let t0 = null, raf = null, done = false, pid = null;
  const MAXML = 2.4; // 動畫上限（示範值）
  function frame(){
    const p = Math.min(1, (performance.now()-t0)/FULL);
    fill.style.height = (p*MAXML*40)+'px'; mt.style.width = (p*100)+'%';
    vol.textContent = `回抽量：約 ${(p*MAXML).toFixed(1)} mL` + (p>=1 ? '（抽不出了）' : '');
    if (p >= 1) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  function start(e){ if (done) return; e.preventDefault(); pid = e.pointerId; try{ hold.setPointerCapture(pid); }catch(_){} t0 = performance.now(); hold.classList.add('holding'); hold.textContent = '回抽中…不要放開'; raf = requestAnimationFrame(frame); }
  function stop(){ if (done || t0 === null) return; cancelAnimationFrame(raf); t0 = null;
    hold.classList.remove('holding'); hold.textContent = '🩸 按住回抽';
    fill.style.height = '0'; mt.style.width = '0'; vol.textContent = '回抽量：0 mL';
    mark('asp', false); toast('太早放開了：要抽盡並估量', 2600); }
  function finish(){ done = true; t0 = null; hold.classList.remove('holding'); hold.classList.add('done'); hold.textContent = '✓ 抽不出了'; mark('asp', true);
    $('#fb').innerHTML = expBox('ok', `完成：回抽到抽不出為止，估計回抽量約 ${MAXML} mL，記錄下來`, q.explain_ok, srcQ(q)) + nextBtn(); bindNext(); }
  hold.addEventListener('pointerdown', start);
  hold.addEventListener('pointerup', stop); hold.addEventListener('pointercancel', stop);
  hold.addEventListener('contextmenu', e => e.preventDefault());
};

  const seen = [].concat(...Object.values(result).map(r=>r.seen));
  const rows = STEPS9.map((s,i) => {
    const r = result[s.key]; let st = '—';
    if (s.key === 'dmso') st = '案例二'; else if (r) st = r.first ? '✅' : '🔁';
    return `<div class="step"><div class="no">${i+1}</div>${ph(s.id, s.t, '', 'small nocap')}<div class="tx">${esc(s.t)}</div><div class="st" title="第一次就對／重做過">${st}</div></div>`;
  }).join('');
  $('#app').innerHTML = `<div class="card"><span class="badge ok">完成案例一</span><h2>初步處理九步驟總覽</h2>
    <p class="lead">✅＝第一次就對　🔁＝做錯後重做過　第 9 步在案例二。</p><div class="steps">${rows}</div>
    ${seen.length ? `<h3>你看過的後果頁</h3><ul>${seen.map(c=>`<li>${esc(CQ[c].title)}</li>`).join('')}</ul>` : '<p class="hint" style="margin-top:12px">這一輪沒有進過後果頁。</p>'}
    <div class="btnrow"><button class="btn" id="go2">去案例二 Doxorubicin →</button><button class="btn sec" id="again">案例一再玩一次</button><a class="btn sec" href="../">回首頁</a></div></div>`;
  $('#go2').onclick = () => { flow = FLOW2; go(0); };
  $('#again').onclick = () => { for (const k in result) delete result[k]; flow = FLOW1; go(0); };
};

/* ===== 案例二 Doxorubicin 簡版 ===== */
RENDER.scene2 = () => {
  const s = SCENES.sc02;
  $('#app').innerHTML = `<div class="card"><span class="badge acc">情境</span><h2>案例二</h2>${ph('sc02', s.cap, s.desc, 'scene')}
    <p style="margin-top:12px"><b>張示範</b>，右前臂周邊留置針，推注 <b>Doxorubicin</b>（小紅莓）中，穿刺處周圍腫、發紅。前面的步驟（停藥不拔針、PPE、回抽、不壓迫、油性筆）你都做了，現在到<b>敷療</b>。</p>
    ${nextBtn('去查這個藥 →')}</div>`;
  bindNext();
};
RENDER.look2 = () => {
  const q20 = Q[20];
  $('#app').innerHTML = `<div class="card"><span class="badge acc">查詢</span><span class="badge">表單 16</span>
    <div class="stem">Doxorubicin 外滲，查詢站說要怎麼敷？</div>
    <div class="exp info show"><div class="t">開查詢站，輸入 <b>Doxorubicin</b>（或 Adriamycin、小紅莓）</div><div>看「處置」欄與最下方「DMSO」原理段，記住：塗多大範圍、風乾還是覆蓋、幾天。</div>
      <div class="btnrow"><a class="btn navy" href="../lookup/" target="_blank" rel="noopener" id="lk">🔍 開查詢站查 Doxorubicin</a></div></div>
    <div id="qa" style="display:none">${expBox('info', '查到了：DMSO＋冷敷', LOOKUP_DOXO, '查詢站 Doxorubicin 列（院內 2023.5 版）')}
      ${expBox('ok', '為什麼是 DMSO', q20.explain_ok, srcQ(q20))}${nextBtn('開始三題 →')}</div>
    <div id="pre" class="btnrow"><button class="btn sec wide" id="checked">我查過了</button></div></div>`;
  const reveal = () => { $('#qa').style.display = ''; $('#pre').style.display = 'none'; bindNext(); };
  $('#checked').onclick = reveal; $('#lk').addEventListener('click', () => setTimeout(reveal, 300));
};
function dmStep(i){
  return () => {
    const d = DM[i];
    $('#app').innerHTML = `<div class="card"><span class="badge acc">DMSO ${i+1}／3</span><div class="stem">${esc(d.stem)}</div>
      <div class="opts">${d.opts.map((o,j)=>`<button class="opt" data-k="${j}"><span class="k">${'ABC'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div></div>`;
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = +b.dataset.k === d.ans;
      document.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === d.ans) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      mark(d.key, ok);
      $('#fb').innerHTML = expBox(ok?'ok':'ng', ok?'答對了':'正解：'+d.opts[d.ans], LOOKUP_DOXO, '查詢站 Doxorubicin 列（院內 2023.5 版）') + nextBtn(i<2?'下一題 →':'完成 →'); bindNext();
    });
  };
}
RENDER.dm1 = dmStep(0); RENDER.dm2 = dmStep(1); RENDER.dm3 = dmStep(2);
RENDER.sum2 = () => {
  const n = DM.filter(d => result[d.key] && result[d.key].first).length;
  $('#app').innerHTML = `<div class="card"><span class="badge ok">完成案例二</span><h2>DMSO 三題：第一次就對 ${n}／3</h2>
    <div class="exp info show"><div class="t">記住這一行</div><div>${esc(LOOKUP_DOXO)}</div><div class="src">查詢站 Doxorubicin 列（院內 2023.5 版）</div></div>
    <div class="steps" style="margin-top:12px"><div class="step"><div class="no">9</div>${ph('st09', STEPS9[8].t, '', 'small nocap')}<div class="tx">${esc(STEPS9[8].t)}</div><div class="st">${n===3?'✅':'🔁'}</div></div></div>
    <div class="btnrow"><button class="btn" id="go1">回案例一從頭做 →</button><button class="btn sec" id="again">案例二再玩一次</button><a class="btn sec" href="../">回首頁</a></div></div>`;
  $('#go1').onclick = () => { for (const k in result) delete result[k]; flow = FLOW1; go(0); };
  $('#again').onclick = () => { flow = FLOW2; go(0); };
};

/* ---------- 啟動：讀題庫 ---------- */
function loadEmbedded(){ // fetch 失敗（file:// 直接開）時，退而讀 build 注入的內嵌題庫；空的就丟錯
  const t = document.getElementById('qdata').textContent.trim(); if (!t) throw new Error('Failed to fetch');
  return JSON.parse(t);
}
fetch(DATA_URL, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(loadEmbedded).then(d => {
  d.questions.forEach(q => { Q[q.id] = q; });
  const missing = [13,14,15,16,17,18,19,20].filter(id => !Q[id]);
  if (missing.length) throw new Error('題庫缺 Q' + missing.join('、Q'));
  home();
}).catch(err => {
  $('#app').innerHTML = `<div class="err"><b>題庫載入失敗</b>（${esc(err.message)}）。<br>本頁的題目文字來自 <code>assets/data/questions.json</code>，直接雙擊 HTML 用 <code>file://</code> 開會被瀏覽器擋住。<br><b>本機預覽</b>：雙擊同資料夾的 <code>_preview.bat</code>（會啟動本機伺服器並自動開頁），或等 S0 推上 GitHub Pages 後用網址開。</div>`;
});
</script>
